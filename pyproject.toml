[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightning_anemoi_dataset"]

[project]
name = "lightning-anemoi-dataset"
version = "0.1.0"
description = "Anemoi dataset recipes and plugins for THX lightning data on the ICON-CH1 native grid."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anemoi-datasets",
    "anemoi-plugins-meteoswiss",
    "numpy",
    "pandas",
    "scipy",
    "pyproj",
    "xarray",
    "netCDF4",
    "pyyaml",
]

[project.scripts]
lightning-grid = "lightning_anemoi_dataset.cli:main"

[tool.uv.workspace]
members = [
    "packages/anemoi-datasets",
    "packages/anemoi-plugins-meteoswiss",
]

[tool.uv.sources]
anemoi-datasets = { workspace = true, editable = true }
anemoi-plugins-meteoswiss = { workspace = true, editable = true }
