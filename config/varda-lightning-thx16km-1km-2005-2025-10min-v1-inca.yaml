name: varda-lightning-thx16km-1km-2005-2025-10min-v1-inca

description: |
  THX lightning strike counts on the INCA/RADAR Swiss Grid LV95 regular grid
  (710 × 640 cells, ~1 km, EPSG:2056) at 10-minute temporal resolution.

  The data are preprocessed by ``lightning-grid`` (lightningpre_anemoi_dataset)
  with the INCA/RADAR target grid, which reprojects lightning strikes from WGS84
  into the LV95 projected coordinate system and bins them onto the INCA/RADAR cells.
  The resulting NetCDF files contain 2-D WGS84 lat/lon auxiliary coordinate
  arrays so that anemoi can ingest them as an unstructured-equivalent grid.

  Source data: MeteoSwiss THX lightning archive
    /store_new/mch/msclim/hamann/database/lightning/THX
  Preprocessed by: lightningpre_anemoi_dataset (lightning-grid CLI,
    config/preprocess/inca.yaml)
  Preprocessed output: /store_new/mch/msclim/lightning_gridded

licence: CC BY 4.0
attribution: MeteoSwiss
resolution: 1km

dates:
  start: 2025-01-01T00:10
  end: 2025-12-31T23:50
  frequency: 10m

build:
  group_by: daily

input:
  join:

    - thx-lightning:
        data_dir: /store_new/mch/msclim/lightning_gridded
        grid_type: inca
        radius_km: 16
