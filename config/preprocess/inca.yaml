# lightningpre_anemoi_dataset configuration — INCA/RADAR Swiss Grid LV95
#
# Usage:
#   lightning-grid --config config/preprocess/inca.yaml
#
# Produces: /store_new/mch/msclim/lightning_gridded/lightning_inca_YYYYMMDD.nc
# Grid    : INCA/RADAR regular grid, 710 × 640 cells, ~1 km, CH1903+/LV95 (EPSG:2056)
# Time    : 144 × 10-minute end-of-interval steps per day
#
# The output NetCDF must include 2-D WGS84 coordinate arrays:
#   lat(p_i, p_j)  standard_name=latitude   units=degrees_north
#   lon(p_i, p_j)  standard_name=longitude  units=degrees_east
# so that the thx-lightning anemoi source can ingest them without an external
# grid registry file.

start: "20250801"
stop:  "20250831"

granularity:    10min
discharge_type: [CG, IC]
radius_km:      [4, 8, 16]   # 1–3 values; all stored in one NetCDF (radius dimension)

network_bbox: [42.5, 50.2, 0.0, 17.0]   # [lat_min, lat_max, lon_min, lon_max]

archive_path: /store_new/mch/msclim/hamann/database/lightning/THX
output_dir:   /store_new/mch/msclim/lightning_gridded
