name: varda-lightning-thx-1km-2005-2025-10min-v1

description: |
  THX lightning strike counts gridded onto the ICON-CH1 native unstructured
  grid (R19B08, ~1 km) at 10-minute temporal resolution.

  Each timestep contains the number of cloud-to-ground (CG) and intra-cloud
  (IC) lightning strikes accumulated inside each grid cell during the
  preceding 10-minute window. Cells outside the THX network bounding box
  [42.5°N–50.2°N, 0.0°E–17.0°E] are masked (NaN). Gridding uses a radius
  of 8 km (nearest-neighbour + all cells within that radius are incremented).

  Source data: MeteoSwiss THX lightning archive
    /store_new/mch/msclim/hamann/database/lightning/THX
  Preprocessed by: lightningpre_anemoi_dataset (lightning-gridding CLI)
  Preprocessed output: /store_new/mch/msclim/lightning_gridded

licence: CC BY 4.0
attribution: MeteoSwiss
resolution: 1km

dates:
  start: 2005-01-01T00:10
  end: 2025-12-31T23:50
  frequency: 10min

build:
  group_by: daily

input:
  join:

    - thx-lightning:
        data_dir: /store_new/mch/msclim/lightning_gridded
        grid_type: icon
        radius_km: 8
        icon_grid_path: /store_new/mch/msclim/pronos/icon_grid_0001_R19B08_mch.nc

    - forcings:
        template: ${input.join.0.thx-lightning}
        param:
          - cos_latitude
          - cos_longitude
          - sin_latitude
          - sin_longitude
          - cos_julian_day
          - sin_julian_day
          - cos_local_time
          - sin_local_time
          - insolation
